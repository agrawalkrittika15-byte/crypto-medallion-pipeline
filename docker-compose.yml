services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  baserow:
    image: baserow/baserow:1.25.2
    container_name: baserow
    ports:
      - "8081:80"
    environment:
      BASEROW_PUBLIC_URL: "http://localhost:8081"
    volumes:
      - ./baserow-data:/baserow/data
      - baserow_pgdata:/baserow/data/postgres

  nifi:
    image: apache/nifi:1.27.0
    container_name: nifi
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: "admin"
      SINGLE_USER_CREDENTIALS_PASSWORD: "${NIFI_ADMIN_PASSWORD}"

  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: crypto-airflow
    ports:
      - "8090:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "clickhouse-connect"
      BASEROW_TOKEN: "${BASEROW_TOKEN}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    volumes:
      - ./airflow-dags:/opt/airflow/dags
    command: standalone

  superset:
    image: apache/superset:latest
    container_name: superset
    user: root
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "crypto_medallion_superset_secret_key"
      TALISMAN_ENABLED: "False"
      PYTHONPATH: "/usr/local/lib/python3.10/site-packages:/app/.venv/lib/python3.10/site-packages"
    volumes:
      - superset_home:/app/superset_home
    command: >
      bash -c "
      /app/.venv/bin/pip install clickhouse-connect || pip install clickhouse-connect &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@localhost --password admin || true &&
      superset init &&
      gunicorn --bind 0.0.0.0:8088 --workers 2 --timeout 120 'superset.app:create_app()'
      "
    depends_on:
      - clickhouse

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  baserow_pgdata:
  superset_home:
  qdrant_data: