services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  baserow:
    image: baserow/baserow:1.25.2
    container_name: baserow
    ports:
      - "8081:80"
    environment:
      BASEROW_PUBLIC_URL: "http://localhost:8081"
    volumes:
      - ./baserow-data:/baserow/data
      - baserow_pgdata:/baserow/data/postgres

  nifi:
    image: apache/nifi:1.27.0
    container_name: nifi
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: "admin"
      SINGLE_USER_CREDENTIALS_PASSWORD: "${NIFI_ADMIN_PASSWORD}"

  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: crypto-airflow
    ports:
      - "8090:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "clickhouse-connect"
      BASEROW_TOKEN: "${BASEROW_TOKEN}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    volumes:
      - ./airflow-dags:/opt/airflow/dags
    command: standalone

volumes:
  baserow_pgdata: